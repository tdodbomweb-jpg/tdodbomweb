<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tdodbomweb</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(#000000,#3b210f);
color:white;
text-align:center;
}

.container{

margin:30px auto;
padding:25px;
max-width:400px;
background:#1a0d05;
border:3px solid #d4af37;
border-radius:25px;
box-shadow:0 0 25px #d4af37;

}

.logo{

width:220px;
border-radius:20px;

}

h1{

color:#d4af37;
font-size:38px;

}

.live{

color:red;
font-size:24px;
font-weight:bold;

}

button{

background:#d4af37;
color:black;
font-size:22px;
font-weight:bold;
padding:15px 35px;
border:0;
border-radius:30px;

}

audio{

width:100%;
margin-top:20px;

}

.info{

color:#e0b86a;
font-size:18px;

}

</style>

</head>


<body>


<div class="container">


<img class="logo" src="logo.png">


<h1>Tdodbomweb</h1>


<div class="live">
🔴 AO VIVO
</div>


<p class="info">
A melhor programação para você
</p>


<audio controls>

<source src="https://tdodbomweb.out.airtime.pro/tdodbomweb_a">

</audio>


<br><br>


<button>
📻 Ouvir Agora
</button>


<p class="info">
🎵 Tocando agora
</p>


</div>


</body>
</html>
